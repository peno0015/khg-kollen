<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234c42"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>KHG-kollen</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header><div class="brand"><div class="logo">▣</div><div><h1>KHG-kollen</h1><p>Håll koll på datumen</p></div></div><span class="local">Firebase · gemensam lista</span></header><section id="authPanel" class="authPanel"><h2>Logga in</h2><p>Ange ditt användarnamn och lösenord.</p><form id="loginForm"><label>Användarnamn<input id="username" required autocomplete="username" autocapitalize="none" placeholder="Exempel: Emma"></label><label>Lösenord<input id="password" type="password" required autocomplete="current-password"></label><button type="submit" class="primary">Logga in</button><p id="loginError" class="error" role="alert"></p></form></section><div id="accountBar" class="accountBar" hidden><span id="signedInAs"></span><button id="logoutBtn" class="ghost">Logga ut</button></div><main id="appMain" hidden><section class="heading"><div><span class="eyebrow">ÖVERSIKT</span><h2 id="headline">Dagens arbete</h2><p id="today"></p></div><button class="ghost" id="exportBtn" title="Exportera säkerhetskopia">↓ Export</button></section><div class="stats"><button class="stat" data-view="todo"><span>Att rabattera</span><strong id="discountCount">0</strong></button><button class="stat" data-view="expiry"><span>Datumkontroll</span><strong id="expiryCount">0</strong></button></div><nav class="tabs" aria-label="Visa artiklar"><button data-view="todo" class="active">Att göra</button><button data-view="upcoming">Kommande</button><button data-view="all">Alla artiklar</button></nav><section id="list" aria-live="polite"></section><div class="tools"><button class="ghost" id="importBtn">↑ Importera JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></main><button id="addBtn" class="add" hidden>＋ Registrera artikel</button></div><dialog id="editor"><form id="articleForm"><div class="dialogHead"><h2 id="formTitle">Registrera artikel</h2><button type="button" class="iconbtn" id="closeEditor" aria-label="Stäng">✕</button></div><label>Artikelnummer<input id="number" required maxlength="60" autocomplete="off" placeholder="Exempel: 123456"></label><label>Artikelnamn<input id="name" required maxlength="120" placeholder="Exempel: Tortillabröd"></label><label>Bäst före-datum<input id="bestBefore" type="date" required></label><div class="fieldRow"><label>KHG – antal<input id="khgValue" type="number" min="1" max="365" value="1" required></label><label>Enhet<select id="khgUnit"><option value="months">Månader</option><option value="days">Dagar</option></select></label></div><label>Placering (valfritt)<input id="location" maxlength="100" placeholder="Exempel: Tex Mex"></label><p class="calculation" id="calculation">Rabatteringsdatum visas här.</p><div class="dialogActions"><button type="button" class="ghost" id="cancelEditor">Avbryt</button><button type="submit" class="primary">Spara artikel</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
